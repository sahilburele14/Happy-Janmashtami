<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Happy Janmashtami</title>

  <link rel="stylesheet" href="style.css">


</head>

<body>

  <div id="welcomeScreen">

    <div class="welcome-content">

      <div class="peacock-feather">
        🦚
      </div>

      <h1>Happy Janmashtami</h1>

      <p>
        Wishing you a joyous and blessed Janmashtami!
        May Lord Krishna's divine presence fill your life
        with love, happiness, and prosperity.
      </p>

      <button id="startBtn">
        Enter Celebration
      </button>

    </div>

  </div>

  <button id="soundBtn" class="sound-btn">
    🔊 Sound On
  </button>

  <div id="particles"></div>

  <!-- Countdown -->

  <div id="countdown">

    <h2>Janmashtami Celebration Begins In</h2>

    <div class="timer">

      <div class="time-box">
        <span id="days">00</span>
        <small>Days</small>
      </div>

      <div class="time-box">
        <span id="hours">00</span>
        <small>Hours</small>
      </div>

      <div class="time-box">
        <span id="minutes">00</span>
        <small>Minutes</small>
      </div>

      <div class="time-box">
        <span id="seconds">00</span>
        <small>Seconds</small>
      </div>

    </div>

  </div>


  <!-- Celebration Message -->

  <div id="celebrationMessage">

    <div class="celebration-icon">
      🦚 ✨ 🪷
    </div>

    <h2>🎉 Happy Janmashtami! 🎉</h2>

    <p>
      The celebration has begun!
    </p>

    <div class="celebration-lamps">
      🪔 🙏 🪔
    </div>

  </div>

  <video id="screen" src="video.mp4" loop playsinline preload="auto">
  </video>

  <script src="script.js"></script>


</body>

</html>
